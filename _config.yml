# Personal portfolio configuration
lang:                  en
title:                 Andrii Novikov
description:           >
  Software engineer and educator focused on AI-assisted development, product coordination,
  and practical teaching at the intersection of technology, process, and people.
tagline:               Software Engineering · AI · Teaching
keywords:              [software engineering, AI, teaching, project coordination, portfolio]
logo:                  /assets/img/logo.png

author:
  name:                Andrii Novikov
  email:               geralt194@gmail.com

menu:
  - title:             Home
    url:               /
  - title:             Blog
    url:               /blog/
  - title:             Projects
    url:               /projects/
  - title:             About
    url:               /about/

legal:
  - title:             LICENSE
    url:               /LICENSE/
  - title:             NOTICE
    url:               /NOTICE/

copyright:             © 2026 Andrii Novikov.
permalink:             /blog/:year-:month-:day-:title/
paginate:              8
paginate_path:         /blog/:num/

theme:                 jekyll-theme-hydejack
accent_image:          /assets/img/sidebar-bg.svg
accent_color:          '#0f766e'
theme_color:           '#10252a'

defaults:
  - scope:
      path:            assets/
    values:
      sitemap:         false
  - scope:
      path:            demos/
    values:
      sitemap:         false
  - scope:
      path:            licenses/
    values:
      layout:          plain
      sitemap:         false
  - scope:
      type:            projects
    values:
      seo:
        type:          WebPage
  - scope:
      type:            featured_categories
    values:
      seo:
        type:          WebPage
  - scope:
      type:            featured_tags
    values:
      seo:
        type:          WebPage

kramdown:
  math_engine:         katex
  math_engine_opts:    {}
  footnote_backlink:   '&#x21a9;&#xfe0e;'

hydejack:
  post_addons:         [about, related]
  project_addons:      [about]
  no_mark_external:    false
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           false
  no_inline_css:       false
  no_page_style:       false
  no_break_layout:     true
  no_toc:              false
  no_third_column:     false
  no_large_headings:   false
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false
  use_lsi:             false
  cookies_banner:      false
  advertise:           false
  hide_dates:          false
  hide_last_modified:  false
  offline:
    enabled:           false
    cache_version:     1

collections:
  featured_categories:
    permalink:         /:name/
    output:            true
  featured_tags:
    permalink:         /tag-:name/
    output:            true
  projects:
    permalink:         /projects/:path/
    output:            true

exclude:
  - .jekyll-cache
  - .sass-cache
  - .ruby-lsp
  - .wrangler
  - '*.toml'
  - vendor
  - Gemfile
  - Gemfile.lock
  - functions
  - PORTFOLIO-NOTES.md
include:
  - _routes.json
  - .well-known
  - LICENSE.md

plugins:
  - jekyll-default-layout
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-paginate
  - jekyll-readme-index
  - jekyll-redirect-from
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings
  - jekyll-include-cache
  - jekyll-last-modified-at

optional_front_matter:
  remove_originals:    true
readme_index:
  remove_originals:    true
  with_frontmatter:    true
relative_links:
  collections:         true
titles_from_headings:
  strip_title:         true
  collections:         true
compress_html:
  comments:            ["<!--", "-->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]
sass:
  style:               compressed
